<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patrick's Pizza</title>

    <link rel="icon" href="./assets/icons/logo.png">
    <link rel="stylesheet" href="./style.css">

    <script src="./script.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="headerContent">
            <img class="headerLogo" src="./assets/icons/logo.png" alt="Bestell App">

            <img class="menuIcon" src="./assets/icons/menu.png" alt="Menü">
        </div>
    </header>

    <main>
        <section class="restaurantHero">
            <img class="heroImage" src="./assets/img/hero.png" alt="Verschiedene Pizzen">

            <div class="logoCircle">
                <img class="restaurantLogo" src="./assets/img/patrickLogo.png" alt="Patrick's Pizza Logo">
            </div>
        </section>

        <section class="pizzaSection">

            <div class="pizzaHeadline">
                <div class="pizzaHeadlineContent">
                    <h2>Unsere Pizzen</h2>
                </div>
            </div>

            <div class="menuArea">

                <section class="dishes">
                    <div id="dishes-list"></div>
                </section>

                <div class="basket" id="basket">
                    <h2>Bestellübersicht</h2>

                    <div id="basket-items"></div>

                    <div id="basket-calculation"></div>
                </div>

            </div>

        </section>
    </main>



    <footer class="footer">
        <div class="footerContent">

            <img class="footerLogo" src="./assets/icons/logo.png" alt="Bestell App">

            <p>© 2026 Patrick's Pizza</p>

            <div class="footerLinks">
                <a href="#">Impressum</a>
                <a href="#">Datenschutz</a>
            </div>

        </div>
    </footer>

    <nav class="mobileNavigation">

        <a class="navigationButton activeButton" href="#">
            <img src="./assets/icons/Homebutton.png" alt="Startseite">
        </a>

        <a class="navigationButton" href="#">
            <img src="./assets/icons/Profile.png" alt="Profil">
        </a>

        <a class="navigationButton" href="#">
            <img src="./assets/icons/orders.png" alt="Bestellungen">
        </a>

        <a class="navigationButton" href="#basket">
            <img src="./assets/icons/basket.png" alt="Warenkorb">
        </a>

    </nav>


</body>

</html>
